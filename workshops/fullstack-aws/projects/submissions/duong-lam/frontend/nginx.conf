# nginx inside the web container: serves the built React files and passes /api to the backend.
# It plays the same role locally that CloudFront plays on AWS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to the "api" container (Docker Compose gives each service a hostname = its name)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a hash in these file names (index-a1b2c3.js), so they never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns paths like /app and /admin: any path that isn't a real file gets index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
